name: Build unsigned iOS ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Sync Capacitor (web assets + pods)
        run: npx cap sync ios

      - name: Pod install
        run: cd ios/App && pod install --repo-update

      - name: Archive (no code signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry FuelMate-unsigned.ipa Payload
          ls -lh FuelMate-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FuelMate-unsigned-ipa
          path: ${{ runner.temp }}/FuelMate-unsigned.ipa
          if-no-files-found: error
