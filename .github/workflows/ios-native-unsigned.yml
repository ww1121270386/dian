name: Build iOS native (unsigned ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/ios-native/**'
      - '.github/workflows/ios-native-unsigned.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios-native
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project FuelMate.xcodeproj \
            -scheme FuelMate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/FuelMate.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry FuelMate-native-unsigned.ipa Payload
          ls -lh FuelMate-native-unsigned.ipa

      - name: Publish ipa to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="ios-v${VER}-${BUILD}"
          gh release create "$TAG" "$RUNNER_TEMP/FuelMate-native-unsigned.ipa" \
            --title "iOS ${VER} (${BUILD}) unsigned ipa" \
            --notes "自动构建产物，未签名。安装需自行重签（Sideloadly / AltStore + Apple ID，7 天有效）。" \
            || gh release upload "$TAG" "$RUNNER_TEMP/FuelMate-native-unsigned.ipa" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: FuelMate-native-unsigned-ipa
          path: ${{ runner.temp }}/FuelMate-native-unsigned.ipa
          if-no-files-found: error
