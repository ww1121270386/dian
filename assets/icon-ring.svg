<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3FAF5"/>
    </linearGradient>
    <linearGradient id="gring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ED87C"/>
      <stop offset="1" stop-color="#0F8F49"/>
    </linearGradient>
    <linearGradient id="rring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#E02D2D"/>
    </linearGradient>
    <linearGradient id="bolt2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0B8A45"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bgr)"/>

  <!-- 外环：80% 绿 + 20% 红（从 12 点方向顺时针） -->
  <g fill="none" stroke-width="64" stroke-linecap="round">
    <path d="M 512 232 A 280 280 0 1 1 245.7 425.5" stroke="url(#gring)"/>
    <path d="M 245.7 425.5 A 280 280 0 0 1 512 232" stroke="url(#rring)"/>
  </g>

  <!-- 中心闪电 -->
  <path d="M 566 330 L 436 548 L 516 548 L 482 700 L 608 474 L 526 474 Z"
        fill="url(#bolt2)" stroke="#0B8A45" stroke-width="6" stroke-linejoin="round"/>
</svg>
