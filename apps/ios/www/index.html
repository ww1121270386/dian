<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>电耗管家</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(150deg, #48C572 0%, #1CAB5C 52%, #0F9149 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      color: #08240F;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 22px;
      padding: 26px 22px 22px; box-shadow: 0 18px 40px rgba(6, 60, 30, .28);
    }
    .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 14px;
      background: linear-gradient(150deg, #48C572, #0F9149);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: #fff; font-weight: 800;
    }
    h1 { font-size: 19px; text-align: center; margin: 0 0 6px; font-weight: 700; }
    p.sub { font-size: 12.5px; color: #7b8089; text-align: center; margin: 0 0 20px; line-height: 1.6; }
    label { font-size: 12.5px; color: #5b6068; display: block; margin-bottom: 6px; }
    input {
      width: 100%; height: 46px; padding: 0 14px; font-size: 15px;
      border: 1px solid #e3e6ea; border-radius: 12px; outline: none;
      background: #fafbfc; color: #1a1d21;
    }
    input:focus { border-color: #1CAB5C; background: #fff; }
    button {
      width: 100%; height: 48px; margin-top: 16px; border: 0; border-radius: 12px;
      background: #1CAB5C; color: #fff; font-size: 15.5px; font-weight: 600;
    }
    button:active { background: #168f4d; }
    .hint { font-size: 11.5px; color: #9aa0a8; text-align: center; margin-top: 14px; line-height: 1.6; }
    .err { color: #e5484d; font-size: 12.5px; text-align: center; margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>电耗管家</h1>
    <p class="sub">请填写 NAS 上电耗管家的访问地址<br />例如 http://192.168.1.10:3280</p>
    <label for="url">服务器地址</label>
    <input id="url" type="url" inputmode="url" placeholder="http://192.168.1.10:3280" autocapitalize="off" autocorrect="off" />
    <button id="go">连接并打开</button>
    <div class="err" id="err"></div>
    <div class="hint">地址保存在本机，换网络或换 IP 时可返回此页修改</div>
  </div>
  <script>
    var KEY = 'fm_server_url';
    var input = document.getElementById('url');
    var err = document.getElementById('err');
    var saved = localStorage.getItem(KEY) || '';
    input.value = saved;

    function normalize(v) {
      var u = (v || '').trim();
      if (!u) return '';
      if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
      return u.replace(/\/+$/, '');
    }

    document.getElementById('go').addEventListener('click', function () {
      var u = normalize(input.value);
      if (!u) { err.textContent = '请填写服务器地址'; return; }
      err.textContent = '正在连接…';
      localStorage.setItem(KEY, u);
      location.replace(u);
    });

    // 已保存地址时自动进入
    if (saved) {
      location.replace(saved);
    }
  </script>
</body>
</html>
